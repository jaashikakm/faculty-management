{% extends "base.html" %}
{% block title %}Leave Balance{% endblock %}
{% block content %}
<h2>My Leave Balance</h2>
<p class="text-muted">Leave year: June 1 to May 31.</p>
<div class="row g-3 mt-1">
{% for name, balance in balances.items %}
<div class="col-md-3"><div class="card shadow-sm"><div class="card-body text-center"><h6>{{ name }}</h6><div class="display-6 fw-bold">{{ balance }}</div></div></div></div>
{% endfor %}
</div>
{% endblock %}
